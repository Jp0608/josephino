<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.d{font-family:Manrope,sans-serif;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.dark{background:#06263a;color:#fff}.light{background:#f5f8fa;color:#0b1d29}.blue{background:#0b6e99;color:#fff}
.brand{position:absolute;left:80px;top:150px;display:flex;align-items:center;gap:16px;font-family:Manrope,sans-serif;font-weight:800;font-size:40px;letter-spacing:-.04em}
.k{position:absolute;left:80px;right:80px;top:330px;font-size:34px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.q{position:absolute;left:80px;right:80px;top:400px;font-size:96px;line-height:1.04}
.foot{position:absolute;left:80px;right:80px;bottom:300px;font-size:30px;font-weight:600;opacity:.7}
.dark .k,.blue .k{color:#7dd3ea}.light .k{color:#0b6e99}
.phone{position:absolute;left:300px;top:820px;width:480px;height:1040px;border-radius:62px;background:#041a28;padding:14px;box-shadow:0 60px 120px -40px rgba(0,0,0,.6)}
.phone div{width:100%;height:100%;border-radius:50px;overflow:hidden;background:#fff}.phone img{width:100%}
svg.w{position:absolute;left:0;bottom:0}
em{font-style:normal;color:#5eead4}.light em{color:#0b6e99}
</style></head><body>
<div id="root"></div>
<script>
const logo = (c1, c2) => `<svg width="56" height="56" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.5" stroke="${c1}" stroke-width="4.5"/><path d="M5.5 17.2c2.6-2.4 5.2-2.4 7.8 0s5.2 2.4 7.8 0 4.4-2 5.8-.9" stroke="${c2}" stroke-width="2.6" stroke-linecap="round"/></svg>ondaro`;
const waves = (op) => `<svg class="w" width="1080" height="260" viewBox="0 0 1080 260" preserveAspectRatio="none"><path d="M0 120 C180 60 360 180 540 120 S900 60 1080 120 V260 H0Z" fill="#0A4F73" opacity="${op}"/><path d="M0 170 C200 120 380 220 560 170 S900 120 1080 170 V260 H0Z" fill="#1391BE" opacity="${op * 0.6}"/></svg>`;
const S = [
  ["dark", "Pergunta rápida 👇", "Você trabalha com <em>manutenção de piscina?</em>", "Responda na enquete", 1],
  ["dark", "Enquete", "Como você registra suas visitas <em>hoje?</em>", "", 1],
  ["light", "Sincero", "Depois da visita, seu cliente recebe <em>alguma coisa?</em>", "", 0],
  ["dark", "De 0 a 10", "Algum cliente já duvidou que <em>você foi?</em> 😅", "", 1],
  ["light", "Caixa aberta", "O que mais te atrapalha na hora de <em>registrar a visita?</em>", "Sem julgamento. Vou ler todas.", 0],
  ["dark", "É assim no Ondaro", "Data, fotos, medições e <em>a sua marca.</em>", "", 0, true],
  ["blue", "Valeu!", "Amanhã eu comento as respostas por aqui. <em>Sem expor ninguém.</em> 💙", "", 1],
];
const i = +(location.hash.slice(1) || 0), s = S[i];
document.body.className = s[0];
const light = s[0] === "light";
document.getElementById("root").innerHTML =
  `<div class="brand">${logo(light ? "#0b6e99" : "#1391BE", light ? "#0f8f7f" : "#5EEAD4")}</div>` +
  `<div class="k">${s[1]}</div><div class="q d" style="${s[5] ? "font-size:84px" : ""}">${s[2]}</div>` +
  (s[3] ? `<div class="foot">${s[3]}</div>` : "") +
  (s[5] ? `<div class="phone"><div><img src="07-relatorio.png" alt=""></div></div>` : "") +
  (s[4] ? waves(light ? 0.25 : 0.9) : "");
</script></body></html>
