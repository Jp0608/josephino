<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#06263a}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.d{font-family:Manrope,sans-serif;font-weight:800;letter-spacing:-.03em}
.cap{left:70px;width:940px;text-align:center;color:#fff;font-size:76px;line-height:1.08}
.cap em{font-style:normal;color:#5eead4}
.kick{left:0;width:1080px;text-align:center;font-size:34px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7dd3ea}
.phone{left:250px;top:560px;width:580px;height:1248px;border-radius:72px;background:#041a28;padding:16px;box-shadow:0 70px 140px -40px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08) inset}
.screen{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#f5f8fa}
.screen img{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:50% 0}
.notch{position:absolute;left:50%;top:30px;width:150px;height:34px;margin-left:-75px;border-radius:20px;background:#041a28;z-index:3}
/* whatsapp */
#chat{left:90px;top:640px;width:900px;height:900px;border-radius:44px;background:#0b141a;overflow:hidden;box-shadow:0 60px 120px -40px rgba(0,0,0,.6)}
#chat .top{height:130px;background:#1f2c34;display:flex;align-items:center;gap:24px;padding:0 36px;color:#e9edef;font-size:38px;font-weight:600}
#chat .av{width:78px;height:78px;border-radius:50%;background:#6b7c85;display:grid;place-items:center;font-size:34px;color:#fff}
#chat .sub{font-size:26px;color:#8696a0;font-weight:400}
.bub{position:absolute;left:40px;max-width:760px;background:#1f2c34;color:#e9edef;font-size:46px;line-height:1.3;padding:26px 32px 40px;border-radius:0 30px 30px 30px}
.bub small{position:absolute;right:22px;bottom:10px;font-size:22px;color:#8696a0}
.typing{position:absolute;left:40px;background:#1f2c34;border-radius:0 30px 30px 30px;padding:30px 34px;display:flex;gap:12px}
.typing i{width:16px;height:16px;border-radius:50%;background:#8696a0}
#strike{height:10px;background:#f08470;border-radius:6px}
.pill{display:inline-block;background:#5eead4;color:#06263a;border-radius:999px;padding:14px 34px;font-size:40px;font-weight:800;font-family:Manrope,sans-serif}
#hook{left:60px;width:960px;top:190px;text-align:center;color:#fff;font-size:84px;line-height:1.06}
#hook b{color:#5eead4}
</style></head><body>
<svg class="abs" style="left:0;bottom:0" width="1080" height="420" viewBox="0 0 1080 420" preserveAspectRatio="none">
  <path id="w1" fill="#0A4F73"/><path id="w2" fill="#0B6E99" opacity=".7"/><path id="w3" fill="#1391BE" opacity=".4"/>
</svg>

<!-- 1: gancho + WhatsApp -->
<div id="hook" class="abs d"></div>
<div id="chat" class="abs">
  <div class="top"><div class="av">C</div><div>Casa 14 <div class="sub">online</div></div></div>
  <div id="b1" class="bub" style="top:190px">Ninguém veio ontem, né? 🤔<small>07:42</small></div>
  <div id="ty" class="typing" style="top:360px"><i></i><i></i><i></i></div>
</div>

<!-- 2: sua palavra -->
<div id="s2" class="abs" style="left:0;top:0;width:1080px;height:1920px">
  <div class="abs d cap" style="top:560px" id="s2a">Você foi.<br>Limpou. Mediu.</div>
  <div class="abs d cap" style="top:860px;color:#b9e3f2;font-size:64px" id="s2b">E a única prova é…</div>
  <div class="abs d cap" style="top:1000px;font-size:96px" id="s2c"><span id="s2w" style="position:relative;display:inline-block">a sua palavra.<i id="strike" class="abs" style="left:-10px;top:55%"></i></span></div>
</div>

<!-- 3-6: telas -->
<div id="kick" class="abs kick" style="top:200px"></div>
<div id="cap" class="abs d cap" style="top:262px;font-size:72px"></div>
<div id="phone" class="abs phone"><div class="notch"></div><div class="screen" id="screens">
  <img src="07-relatorio.png" alt=""><img src="05-fotos.png" alt=""><img src="07b-relatorio-agua.png" alt=""><img src="06-finalizado.png" alt="">
</div></div>

<!-- 7: final -->
<div id="s7" class="abs" style="left:0;top:0;width:1080px;height:1920px">
  <svg class="abs" id="mark" style="left:420px;top:420px" width="240" height="240" viewBox="0 0 32 32" fill="none">
    <circle cx="16" cy="16" r="12.5" stroke="#1391BE" stroke-width="5"/>
    <path d="M5.5 17.2c2.6-2.4 5.2-2.4 7.8 0s5.2 2.4 7.8 0 4.4-2 5.8-.9" stroke="#5EEAD4" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
  <div id="s7a" class="abs d cap" style="top:740px;font-size:96px">Piscineiro que documenta <em>não discute.</em></div>
  <div id="s7b" class="abs" style="left:0;width:1080px;top:1130px;text-align:center"><span class="pill">Ondaro · 14 dias grátis</span></div>
  <div id="s7c" class="abs" style="left:0;width:1080px;top:1240px;text-align:center;color:#b9e3f2;font-size:38px;font-weight:600">link na bio</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const show = (el, o, x = 0, y = 0, s = 1) => { el.style.opacity = o; el.style.transform = `translate(${x}px,${y}px) scale(${s})`; el.style.visibility = o > 0.001 ? "visible" : "hidden"; };
const HOOK = decodeURIComponent((location.hash || "#").slice(1)) || "Ninguém veio ontem? <b>Mostra a prova em 1&nbsp;toque.</b>";
$("hook").innerHTML = HOOK;

function wave(t, amp, base, speed, phase) {
  let d = `M0 420 L0 ${base}`;
  for (let x = 0; x <= 1080; x += 30) d += ` L${x} ${base + Math.sin(x / 170 + t * speed + phase) * amp + Math.sin(x / 90 + t * speed * 1.6) * amp * 0.35}`;
  return d + " L1080 420 Z";
}
// cenas: [início, fim, imagem, kicker, legenda, zoom alvo]
const SC = [
  [7.0, 11.0, 0, "Com o Ondaro", "Cada visita fecha com <em>relatório.</em>", [1.12, 0]],
  [11.0, 14.6, 1, "Da piscina dele", "Foto de <em>antes</em> e de <em>depois.</em>", [1.0, 0]],
  [14.6, 18.4, 2, "Medições da água", "pH, cloro e alcalinidade <em>na faixa da sua empresa.</em>", [1.08, 0]],
  [18.4, 22.0, 3, "Pelo seu WhatsApp", "Manda o link <em>em 1 toque.</em>", [1.0, 0]],
];
window.renderFast = (t) => {
  $("w1").setAttribute("d", wave(t, 18, 250, 1.1, 0));
  $("w2").setAttribute("d", wave(t, 22, 285, 1.5, 2));
  $("w3").setAttribute("d", wave(t, 14, 320, 2.0, 4));
  // 1
  const o1 = 1 - seg(t, 3.4, 3.9);
  show($("hook"), Math.min(seg(t, 0, 0.25), o1), 0, 20 * (1 - easeOut(seg(t, 0, 0.4))));
  show($("chat"), Math.min(seg(t, 0.05, 0.35), o1), 0, 60 * (1 - easeOut(seg(t, 0.05, 0.5))) - 80 * eio(seg(t, 3.4, 3.9)));
  show($("b1"), seg(t, 0.4, 0.6), 0, 0, 0.9 + 0.1 * easeOut(seg(t, 0.4, 0.7)));
  show($("ty"), seg(t, 1.2, 1.4));
  [...$("ty").children].forEach((d, i) => (d.style.opacity = 0.4 + 0.6 * Math.abs(Math.sin(t * 5 + i))));
  // 2
  const o2 = 1 - seg(t, 6.6, 7.1);
  show($("s2"), o2);
  show($("s2a"), seg(t, 3.8, 4.2), 0, 30 * (1 - easeOut(seg(t, 3.8, 4.3))));
  show($("s2b"), seg(t, 4.9, 5.3), 0, 30 * (1 - easeOut(seg(t, 4.9, 5.4))));
  show($("s2c"), seg(t, 5.4, 5.7), 0, 0, 1.15 - 0.15 * easeOut(seg(t, 5.4, 5.8)));
  $("strike").style.width = `${eio(seg(t, 6.0, 6.4)) * ($("s2w").offsetWidth + 20)}px`;
  // 3-6
  const po = seg(t, 6.9, 7.4) * (1 - seg(t, 21.8, 22.3));
  show($("phone"), po, 0, 120 * (1 - easeOut(seg(t, 6.9, 7.6))));
  const imgs = $("screens").children;
  let cur = SC.findIndex((s) => t < s[1]); if (cur < 0) cur = SC.length - 1;
  [...imgs].forEach((im, i) => {
    const s = SC[i];
    const vis = i === 0 ? 1 - seg(t, s[1] - 0.25, s[1]) : seg(t, s[0] - 0.25, s[0]) * (i === SC.length - 1 ? 1 : 1 - seg(t, s[1] - 0.25, s[1]));
    const [z, oy] = s[5];
    const zk = eio(seg(t, s[0] + 0.6, s[0] + 1.6)) * (1 - eio(seg(t, s[1] - 1.0, s[1] - 0.3)));
    const scroll = 0;
    im.style.opacity = vis;
    im.style.transform = `translateY(${scroll}px) scale(${1 + (z - 1) * zk}) translateY(${-oy * 100 * zk}%)`;
  });
  const s = SC[cur], co = seg(t, s[0], s[0] + 0.3) * (1 - seg(t, s[1] - 0.25, s[1])) * po;
  $("kick").textContent = s[3]; $("cap").innerHTML = s[4];
  show($("kick"), co, 0, 16 * (1 - easeOut(seg(t, s[0], s[0] + 0.4))));
  show($("cap"), co, 0, 24 * (1 - easeOut(seg(t, s[0] + 0.05, s[0] + 0.45))));
  // 7
  show($("s7"), seg(t, 22.2, 22.6));
  show($("mark"), seg(t, 22.3, 22.7), 0, 0, 0.7 + 0.3 * easeOut(seg(t, 22.3, 22.9)));
  show($("s7a"), seg(t, 22.7, 23.1), 0, 30 * (1 - easeOut(seg(t, 22.7, 23.2))));
  show($("s7b"), seg(t, 23.5, 23.8), 0, 0, 0.85 + 0.15 * easeOut(seg(t, 23.5, 23.9)));
  show($("s7c"), seg(t, 23.9, 24.2));
};
window.renderFast(0);
</script></body></html>
