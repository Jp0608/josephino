<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#06263a}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;position:relative}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0}
.d{font-family:Manrope,sans-serif;font-weight:800;letter-spacing:-.035em;line-height:.98;text-wrap:balance}
em{font-style:normal;color:#5eead4}
.g{color:#b5e04a}
.top{position:absolute;left:72px;right:72px;top:64px;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85);z-index:5}
.logo{display:flex;align-items:center;gap:12px;font-family:Manrope,sans-serif;font-weight:800;font-size:32px;letter-spacing:-.04em;text-transform:none;color:#fff}
.prog{position:absolute;left:72px;right:72px;bottom:56px;height:3px;background:rgba(255,255,255,.18);z-index:5}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#5eead4}
.foot{position:absolute;left:72px;right:72px;bottom:80px;display:flex;justify-content:space-between;font-size:22px;font-weight:600;color:rgba(255,255,255,.72);z-index:5;letter-spacing:.04em}
.kick{font-size:24px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#5eead4;display:flex;align-items:center;gap:16px}
.kick:before{content:"";width:48px;height:2px;background:currentColor}
.body{font-size:34px;line-height:1.38;color:rgba(255,255,255,.88);max-width:860px}
.blk{position:absolute;left:72px;right:72px;z-index:4}
.phone{position:absolute;width:430px;height:930px;border-radius:58px;background:#020f18;padding:12px;box-shadow:0 60px 120px -30px rgba(0,0,0,.7),0 0 0 1.5px rgba(255,255,255,.14) inset;z-index:3}
.phone .s{width:100%;height:100%;border-radius:47px;overflow:hidden;background:#fff;position:relative}
.phone img{width:100%;display:block}
.phone .n{position:absolute;left:50%;top:22px;width:110px;height:28px;margin-left:-55px;border-radius:16px;background:#020f18;z-index:2}
.card{background:rgba(6,38,58,.62);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:38px 36px;display:grid;grid-template-columns:96px 1fr;gap:22px;align-items:center}
.card .k{font-family:Manrope,sans-serif;font-weight:800;font-size:64px;line-height:1;color:transparent;-webkit-text-stroke:2px #b5e04a}
.card h3{font-family:Manrope,sans-serif;font-weight:800;font-size:52px;letter-spacing:-.03em;line-height:1.05}
.card p{font-size:26px;color:rgba(255,255,255,.75);margin-top:6px}
.chk{display:grid;gap:28px}
.chk div{display:flex;align-items:center;gap:24px;font-family:Manrope,sans-serif;font-weight:700;font-size:54px;letter-spacing:-.02em;padding-bottom:28px;border-bottom:1px solid rgba(255,255,255,.14)}
.chk i{flex:none;width:52px;height:52px;border-radius:14px;border:3px solid #5eead4;display:grid;place-items:center;font-style:normal;color:#5eead4;font-size:30px}
.src{font-size:20px;color:rgba(255,255,255,.55);margin-top:22px}
.rule{display:flex;gap:22px;align-items:flex-start;padding:26px 0;border-top:1px solid rgba(255,255,255,.16)}
.rule b{flex:none;width:64px;height:64px;border-radius:50%;background:#5eead4;color:#06263a;display:grid;place-items:center;font-family:Manrope,sans-serif;font-size:30px}
.rule h3{font-family:Manrope,sans-serif;font-weight:800;font-size:46px;letter-spacing:-.03em;line-height:1.05}
.rule p{font-size:27px;color:rgba(255,255,255,.75);margin-top:8px}
.callout{position:absolute;z-index:4;background:#fff;color:#0b1d29;border-radius:22px;padding:18px 24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);font-size:24px;font-weight:600;display:flex;gap:14px;align-items:center}
.callout i{width:44px;height:44px;border-radius:12px;background:#fff4e0;display:grid;place-items:center;color:#b3561f;font-style:normal;font-weight:800}
.callout small{display:block;font-size:19px;color:#566874;font-weight:500}
.btn{display:inline-block;background:#5eead4;color:#06263a;font-family:Manrope,sans-serif;font-weight:800;font-size:36px;padding:24px 40px;border-radius:999px}
.lbl{position:absolute;z-index:4;font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;border-radius:999px;background:rgba(6,38,58,.7);backdrop-filter:blur(8px)}
</style></head><body>
<style>
.src{font-size:20px;color:rgba(255,255,255,.55);margin-top:18px}
.range{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:20px;padding:30px 0;border-top:1px solid rgba(255,255,255,.16)}
.range b{font-family:Manrope,sans-serif;font-weight:800;font-size:76px;letter-spacing:-.04em;color:#fff}
.range span{font-size:26px;color:rgba(255,255,255,.7);text-align:right}
.formula{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:32px;padding:40px}
.formula .row{display:flex;align-items:center;justify-content:space-between;font-size:34px;padding:16px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.formula .row b{font-family:Manrope,sans-serif;font-size:44px}
.formula .tot{border:0;padding-top:26px}
.formula .tot b{color:#5eead4;font-size:64px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.vs div{background:rgba(6,38,58,.62);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:34px}
.vs h3{font-family:Manrope,sans-serif;font-weight:800;font-size:46px;letter-spacing:-.03em;margin-bottom:20px}
.vs p{font-size:27px;line-height:1.4;color:rgba(255,255,255,.82);margin-bottom:12px}
.vs .p{color:#5eead4}.vs .m{color:#f0a06a}
</style>
<div id="r"></div>
<script>
const N = 8;
const LOGO = `<svg width="40" height="40" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.5" stroke="#1391BE" stroke-width="4.5"/><path d="M5.5 17.2c2.6-2.4 5.2-2.4 7.8 0s5.2 2.4 7.8 0 4.4-2 5.8-.9" stroke="#5EEAD4" stroke-width="2.6" stroke-linecap="round"/></svg>ondaro`;
const chrome = (i, label) => `<div class="top"><span class="logo">${LOGO}</span><span>${label}</span></div>
<div class="foot"><span>${String(i).padStart(2,"0")} / ${String(N).padStart(2,"0")}</span><span>${i < N ? "arraste →" : "salve 📌"}</span></div>
<div class="prog"><i style="width:${(i / N) * 100}%"></i></div>`;
const S = {
1: () => `<div class="bg" style="background-image:url(casa.jpg);background-position:50% 75%"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.55) 0%,rgba(6,38,58,0) 20%,rgba(6,38,58,.1) 38%,rgba(6,38,58,.9) 62%,#06263a 100%)"></div>
${chrome(1, "Negócio de piscina")}
<div class="blk" style="bottom:170px">
  <div class="kick">Sem chute</div>
  <h1 class="d" style="font-size:108px;margin-top:28px">Quanto cobrar pela <em>manutenção de piscina?</em></h1>
  <p class="body" style="margin-top:30px">O cálculo que impede você de trabalhar no prejuízo.</p>
</div>`,
2: () => `<div class="bg" style="background-image:url(agua2.jpg);opacity:.35"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.5),#06263a 70%)"></div>
${chrome(2, "O que circula por aí")}
<div class="blk" style="top:190px">
  <div class="kick">Preços publicados na internet</div>
  <h2 class="d" style="font-size:80px;margin:26px 0 40px">Nenhum bate com o outro.</h2>
  <div class="range"><b>R$ 150–300</b><span>por mês<br>Cronoshare</span></div>
  <div class="range"><b>R$ 350–600</b><span>por mês<br>Revista Oeste, 12/2025</span></div>
  <div class="range" style="border-bottom:1px solid rgba(255,255,255,.16)"><b>~R$ 80</b><span>por visita<br>GetNinjas</span></div>
  <p class="body" style="margin-top:36px">Serve para se situar. Copiar o preço de outro é chute: o custo dele não é o seu.</p>
</div>`,
3: () => `<div class="bg" style="background-image:url(amanhecer.jpg);background-position:60% 50%;opacity:.4"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.55),#06263a 62%)"></div>
${chrome(3, "Passo 1")}
<div class="blk" style="bottom:150px">
  <div class="kick">Some tudo o que você gasta no mês</div>
  <h2 class="d" style="font-size:88px;margin:26px 0 36px">5 custos que <em>entram na conta</em></h2>
  <div class="rule"><b>1</b><div><h3>Seu tempo</h3><p>Horas em cada piscina, contando a espera do tratamento.</p></div></div>
  <div class="rule"><b>2</b><div><h3>Deslocamento</h3><p>Combustível, pedágio, manutenção do carro ou da moto.</p></div></div>
  <div class="rule"><b>3</b><div><h3>Produto químico</h3><p>Se estiver incluso no preço, ele é o custo que mais varia.</p></div></div>
  <div class="rule"><b>4</b><div><h3>Equipamento</h3><p>Aspirador, escova, kit de teste: tudo desgasta.</p></div></div>
  <div class="rule"><b>5</b><div><h3>Imposto e administração</h3><p>MEI, celular, sistema, contador.</p></div></div>
</div>`,
4: () => `<div class="bg" style="background-image:url(fundo.jpg);opacity:.28"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.4),#06263a 60%)"></div>
${chrome(4, "Passo 2")}
<div class="blk" style="bottom:160px">
  <div class="kick">A conta</div>
  <h2 class="d" style="font-size:96px;margin:26px 0 44px">Custo por visita <em>+ margem.</em></h2>
  <div class="formula">
    <div class="row"><span>Custos do mês</span><b>R$ 4.000</b></div>
    <div class="row"><span>÷ visitas no mês</span><b>80</b></div>
    <div class="row"><span>= custo por visita</span><b>R$ 50</b></div>
    <div class="row"><span>+ margem de 40%</span><b>R$ 20</b></div>
    <div class="row tot"><span>Preço por visita</span><b>R$ 70</b></div>
  </div>
  <p class="src" style="font-size:24px">Exemplo com números redondos, só para mostrar a conta. Faça com os seus.</p>
</div>`,
5: () => `<div class="bg" style="background-image:url(deck.jpg)"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.7) 0%,rgba(6,38,58,.35) 30%,rgba(6,38,58,.92) 58%,#06263a 100%)"></div>
${chrome(5, "Passo 3")}
<div class="blk" style="bottom:160px">
  <div class="kick">Cada piscina é uma conta</div>
  <h2 class="d" style="font-size:88px;margin:26px 0 34px">O que <em>sobe o preço</em></h2>
  <div class="chk">
    <div><i>↑</i>Piscina grande ou com muito volume</div>
    <div><i>↑</i>Árvores e folhas caindo na água</div>
    <div><i>↑</i>Mais visitas por semana</div>
    <div style="border:0"><i>↑</i>Distância da sua rota</div>
  </div>
</div>`,
6: () => `<div class="bg" style="background-image:url(heroi.jpg);background-position:50% 40%"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.6) 0%,rgba(6,38,58,.2) 22%,rgba(6,38,58,.92) 48%,#06263a 100%)"></div>
${chrome(6, "A decisão")}
<div class="blk" style="bottom:170px">
  <div class="kick">Produto químico</div>
  <h2 class="d" style="font-size:84px;margin:26px 0 44px">Incluso ou <em>à parte?</em></h2>
  <div class="vs">
    <div><h3>Incluso</h3><p class="p">+ Cliente gosta do preço fixo.</p><p class="m">− Mês de chuva, quem paga o produto extra é você.</p></div>
    <div><h3>À parte</h3><p class="p">+ Você cobra o que usou.</p><p class="m">− Precisa mostrar o que aplicou, sempre.</p></div>
  </div>
  <p class="body" style="margin-top:40px">Nos dois casos, a resposta é a mesma: <b>registrar o que aplicou em cada visita.</b></p>
</div>`,
7: () => `<div class="bg" style="background-image:url(amanhecer.jpg);background-position:62% 50%"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.6) 0%,rgba(6,38,58,.2) 25%,rgba(6,38,58,.9) 55%,#06263a 100%)"></div>
${chrome(7, "Reajuste sem medo")}
<div class="blk" style="bottom:170px">
  <div class="kick">Onde o lucro some</div>
  <h2 class="d" style="font-size:92px;margin:26px 0 34px">O cliente que <em>dá prejuízo</em> você não vê no caderno.</h2>
  <p class="body">No Ondaro, cada produto aplicado sai do estoque com o custo. O app mostra a receita e o custo químico de cada cliente.</p>
  <p class="body" style="margin-top:24px">Na hora de reajustar, você tem o número na mão. Não o achismo.</p>
</div>`,
8: () => `<div class="bg" style="background-image:url(casa.jpg);background-position:50% 70%;opacity:.25"></div>
<div class="shade" style="background:linear-gradient(180deg,rgba(6,38,58,.6),#06263a 72%)"></div>
${chrome(8, "Ondaro")}
<div class="blk" style="top:250px;text-align:center">
  <div style="font-size:120px;line-height:1">📌</div>
  <h2 class="d" style="font-size:96px;margin:36px 0 26px">Salve para revisar <em>o seu preço.</em></h2>
  <p class="body" style="margin:0 auto 56px">E mande para o colega que cobra o mesmo há 3 anos.</p>
  <span class="btn">Ondaro · 14 dias grátis</span>
  <p style="margin-top:28px;font-size:28px;color:rgba(255,255,255,.75);font-weight:600">Custo por cliente · link na bio</p>
</div>`,
};
const i = +(location.hash.slice(1) || 1);
document.getElementById("r").innerHTML = S[i]();
</script></body></html>
